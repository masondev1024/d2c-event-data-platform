buildscript {
  repositories { mavenCentral() }
  dependencies { classpath 'com.gradleup.shadow:shadow-gradle-plugin:8.3.11' }
}

apply plugin: 'java-library'
apply plugin: 'com.gradleup.shadow'

group = 'org.apache.iceberg'
version = '1.12.0-d2c-security1'

repositories {
  maven {
    url = uri('/rebuilt-repository')
    content { includeModule('org.apache.parquet', 'parquet-jackson') }
  }
  mavenCentral()
}

configurations.all {
  exclude group: 'org.slf4j', module: 'slf4j-log4j12'
  exclude group: 'org.mortbay.jetty'
  exclude group: 'com.sun.jersey'
  exclude group: 'com.sun.jersey.contribs'
  exclude group: 'org.pentaho', module: 'pentaho-aggdesigner-algorithm'
  exclude group: 'org.jetbrains', module: 'annotations'
  resolutionStrategy {
    dependencySubstitution {
      substitute module('org.apache.parquet:parquet-jackson') using module('org.apache.parquet:parquet-jackson:1.17.1-d2c-jackson2.21.7')
      substitute module('org.lz4:lz4-java') using module('at.yawk.lz4:lz4-java:1.11.4')
      substitute module('io.airlift:aircompressor') using module('io.airlift:aircompressor:2.0.3')
      substitute module('org.bouncycastle:bcprov-jdk18on') using module('org.bouncycastle:bcprov-jdk18on:1.86')
    }
    eachDependency { details ->
      if (details.requested.group == 'io.netty' &&
          (details.requested.version?.startsWith('4.1.') || details.requested.version?.startsWith('4.2.'))) {
        details.useVersion('4.2.18.Final')
      }
    }
    force 'com.fasterxml.jackson:jackson-bom:2.21.7'
    force 'com.fasterxml.jackson.core:jackson-core:2.21.7'
    force 'com.fasterxml.jackson.core:jackson-databind:2.21.7'
    force 'com.fasterxml.jackson.core:jackson-annotations:2.21'
    force 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.7'
    force 'com.fasterxml.jackson.module:jackson-module-scala_2.13:2.21.7'
    force 'at.yawk.lz4:lz4-java:1.11.4'
  }
}

configurations.implementation {
  exclude group: 'org.apache.spark'
  exclude group: 'org.slf4j'
  exclude group: 'org.apache.commons'
  exclude group: 'commons-pool'
  exclude group: 'commons-codec'
  exclude group: 'org.xerial.snappy'
  exclude group: 'javax.xml.bind'
  exclude group: 'javax.annotation'
  exclude group: 'com.github.luben'
  exclude group: 'com.ibm.icu'
  exclude group: 'org.glassfish'
  exclude group: 'org.abego.treelayout'
  exclude group: 'org.antlr'
  exclude group: 'org.scala-lang'
  exclude group: 'org.scala-lang.modules'
}

dependencies {
  api 'org.apache.iceberg:iceberg-api:1.12.0'
  implementation 'org.apache.iceberg:iceberg-spark-4.1_2.13:1.12.0'
  implementation 'org.apache.iceberg:iceberg-spark-extensions-4.1_2.13:1.12.0'
  implementation 'org.apache.iceberg:iceberg-aws:1.12.0'
  implementation 'org.apache.iceberg:iceberg-azure:1.12.0'
  implementation('org.apache.iceberg:iceberg-aliyun:1.12.0') {
    exclude group: 'edu.umd.cs.findbugs', module: 'findbugs'
    exclude group: 'org.apache.httpcomponents', module: 'httpclient'
    exclude group: 'commons-logging', module: 'commons-logging'
  }
  implementation 'org.apache.iceberg:iceberg-gcp:1.12.0'
  implementation 'org.apache.iceberg:iceberg-bigquery:1.12.0'
  implementation 'org.apache.iceberg:iceberg-hive-metastore:1.12.0'
  implementation('org.apache.iceberg:iceberg-nessie:1.12.0') {
    exclude group: 'com.google.code.findbugs', module: 'jsr305'
  }
  implementation('org.apache.iceberg:iceberg-snowflake:1.12.0') {
    exclude group: 'net.snowflake', module: 'snowflake-jdbc'
  }
}

tasks.withType(AbstractArchiveTask).configureEach {
  preserveFileTimestamps = false
  reproducibleFileOrder = true
}

shadowJar {
  configurations = [project.configurations.runtimeClasspath]
  zip64 true
  relocate 'com.google.errorprone', 'org.apache.iceberg.shaded.com.google.errorprone'
  relocate 'com.google.flatbuffers', 'org.apache.iceberg.shaded.com.google.flatbuffers'
  relocate 'com.fasterxml', 'org.apache.iceberg.shaded.com.fasterxml'
  relocate 'com.github.benmanes', 'org.apache.iceberg.shaded.com.github.benmanes'
  relocate 'org.checkerframework', 'org.apache.iceberg.shaded.org.checkerframework'
  relocate 'org.apache.avro', 'org.apache.iceberg.shaded.org.apache.avro'
  relocate 'avro.shaded', 'org.apache.iceberg.shaded.org.apache.avro.shaded'
  relocate 'com.thoughtworks.paranamer', 'org.apache.iceberg.shaded.com.thoughtworks.paranamer'
  relocate 'org.apache.parquet', 'org.apache.iceberg.shaded.org.apache.parquet'
  relocate 'shaded.parquet', 'org.apache.iceberg.shaded.org.apache.parquet.shaded'
  relocate 'org.apache.orc', 'org.apache.iceberg.shaded.org.apache.orc'
  relocate 'io.airlift', 'org.apache.iceberg.shaded.io.airlift'
  relocate 'org.apache.hc.client5', 'org.apache.iceberg.shaded.org.apache.hc.client5'
  relocate 'org.apache.hc.core5', 'org.apache.iceberg.shaded.org.apache.hc.core5'
  relocate 'io.netty', 'org.apache.iceberg.shaded.io.netty'
  relocate 'org.apache.arrow', 'org.apache.iceberg.shaded.org.apache.arrow'
  relocate 'com.carrotsearch', 'org.apache.iceberg.shaded.com.carrotsearch'
  relocate 'org.threeten.extra', 'org.apache.iceberg.shaded.org.threeten.extra'
  relocate 'org.roaringbitmap', 'org.apache.iceberg.shaded.org.roaringbitmap'
  relocate 'org.apache.datasketches', 'org.apache.iceberg.shaded.org.apache.datasketches'
  archiveClassifier.set(null)
  from(project.projectDir) {
    include 'LICENSE'
    include 'NOTICE'
  }
  exclude 'META-INF/LICENSE*'
  exclude 'META-INF/NOTICE*'
  def bundledNotices = [project.file('LICENSE'), project.file('NOTICE')]
  exclude { it.relativePath.pathString in ['LICENSE', 'NOTICE'] && !(it.file in bundledNotices) }
}

tasks.register('recordRuntimeDependencies') {
  doLast {
    def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
    file('build/runtime-dependencies.txt').text = artifacts.collect {
      def id = it.moduleVersion.id
      "${id.group}:${id.name}:${id.version}"
    }.sort().join('\n') + '\n'
    def records = artifacts.collect { artifact ->
      def id = artifact.moduleVersion.id
      def hash = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
      [coordinate: "${id.group}:${id.name}:${id.version}", filename: artifact.file.name, sha256: hash]
    }.sort { a, b -> a.coordinate <=> b.coordinate }
    file('build/security-runtime-artifacts.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(records)) + '\n'
  }
}

services:
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - kafka-net

  kafka-init:
    image: apache/kafka:3.7.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/kafka-init.sh"]
    volumes:
      - ./kafka-init.sh:/opt/kafka-init.sh:ro
    networks:
      - kafka-net

  postgres:
    profiles: ["d2c"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: d2c
      POSTGRES_USER: d2c
      POSTGRES_PASSWORD: "${D2C_POSTGRES_PASSWORD:-d2c-local-only}"
    volumes:
      - d2c-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2c -d d2c"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kafka-net

  d2c-migrate:
    profiles: ["d2c"]
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: "no"
    command: ["python", "schema.py"]
    environment:
      DATABASE_URL: "postgresql://d2c:${D2C_POSTGRES_PASSWORD:-d2c-local-only}@postgres:5432/d2c"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kafka-net

  d2c-api:
    profiles: ["d2c"]
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgresql://d2c:${D2C_POSTGRES_PASSWORD:-d2c-local-only}@postgres:5432/d2c"
      D2C_ENV: "${D2C_ENV:-development}"
      ALLOW_FAILURE_DRILL: "${ALLOW_FAILURE_DRILL:-false}"
      D2C_OUTBOX_FAILURE_INJECTION: "${D2C_OUTBOX_FAILURE_INJECTION:-}"
      TRUSTED_HOSTS: localhost,127.0.0.1,d2c-api
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      d2c-migrate:
        condition: service_completed_successfully
    networks:
      - kafka-net

  d2c-outbox-publisher:
    profiles: ["d2c"]
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    command: ["python", "outbox_publisher.py"]
    environment:
      DATABASE_URL: "postgresql://d2c:${D2C_POSTGRES_PASSWORD:-d2c-local-only}@postgres:5432/d2c"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_TOPIC: d2c.application.approved.v1
      METRICS_PORT: 9102
    ports:
      - "127.0.0.1:9102:9102"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      d2c-migrate:
        condition: service_completed_successfully
    networks:
      - kafka-net

  d2c-event-consumer:
    profiles: ["d2c"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "services.d2c_event_consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      D2C_EVENT_TOPIC: d2c.application.approved.v1
      D2C_EVENT_DLQ_TOPIC: d2c.application.consumer.dlq.v1
      D2C_EVENT_CONSUMER_GROUP: d2c-application-event-consumer-v1
      D2C_DUCKDB_PATH: /data/d2c_events.duckdb
      METRICS_PORT: 9103
      METRICS_BIND_HOST: 0.0.0.0
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:9103:9103"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net

  fluent-bit:
    image: fluent/fluent-bit:3.2.2
    restart: unless-stopped
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./sensor_logs:/data/sensor_logs
      - ./runtime/fluent-bit/state:/fluent-bit/state
      - ./runtime/fluent-bit/storage:/fluent-bit/storage
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      logstash:
        condition: service_healthy
    networks:
      - kafka-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    restart: unless-stopped
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      XPACK_MONITORING_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9600/_node/pipelines/main >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net

  stream-processor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    command: ["python", "-m", "services.processor"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_TOPICS: factory.sensor.raw.json.v1,factory.sensor.raw.text.v1
      CLEAN_TOPIC: factory.sensor.clean.v1
      DLQ_TOPIC: factory.sensor.dlq.v1
      CONSUMER_GROUP: sensor-normalizer-v1
      METRICS_PORT: 9100
      METRICS_BIND_HOST: 0.0.0.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net

  stream-sink:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "services.sink"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLEAN_TOPIC: factory.sensor.clean.v1
      SINK_DLQ_TOPIC: factory.sensor.sink.dlq.v1
      SINK_CONSUMER_GROUP: sensor-duckdb-sink-v1
      DUCKDB_PATH: /data/sensor.duckdb
      METRICS_PORT: 9101
      METRICS_BIND_HOST: 0.0.0.0
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:9101:9101"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net

  vector:
    profiles: ["aws"]
    image: timberio/vector:0.36.0-debian
    restart: unless-stopped
    # Vector 0.36 enables interpolation by default; strict mode turns a missing
    # Firehose stream name into a startup failure instead of a warning.
    command: ["--config", "/etc/vector/vector.yaml", "--strict-env-vars"]
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - ./runtime/vector:/var/lib/vector
    environment:
      FIREHOSE_STREAM_NAME: "${FIREHOSE_STREAM_NAME:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_REGION: "${AWS_REGION:-ap-northeast-2}"
      AWS_DEFAULT_REGION: "${AWS_REGION:-ap-northeast-2}"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - kafka-net

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=1d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
    depends_on:
      stream-processor:
        condition: service_started
      stream-sink:
        condition: service_started
    networks:
      - kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge

volumes:
  kafka-data:
  d2c-postgres-data:

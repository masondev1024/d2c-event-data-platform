apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: d2c-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - d2c.example.com
      secretName: d2c-api-tls
  rules:
    - host: d2c.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: d2c-api-stable
                port:
                  name: http

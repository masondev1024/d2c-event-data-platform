apiVersion: apps/v1
kind: Deployment
metadata:
  name: d2c-event-consumer
  labels:
    app: d2c-event-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: d2c-event-consumer
  template:
    metadata:
      labels:
        app: d2c-event-consumer
        monitoring: d2c-consumer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: ghcr.io/masondev1024/d2c-event-data-platform:v0.2.0
          command: [python, -m, services.d2c_event_consumer]
          ports:
            - name: metrics
              containerPort: 9103
          envFrom:
            - configMapRef:
                name: d2c-platform-config
          env:
            - name: D2C_DUCKDB_PATH
              value: /data/d2c_events.duckdb
            - name: METRICS_PORT
              value: "9103"
            - name: METRICS_BIND_HOST
              value: 0.0.0.0
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: d2c-event-consumer-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

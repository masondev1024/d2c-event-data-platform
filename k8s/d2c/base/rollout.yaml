apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: d2c-api
  labels:
    app: d2c-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 10
  selector:
    matchLabels:
      app: d2c-api
  template:
    metadata:
      labels:
        app: d2c-api
        monitoring: d2c-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/masondev1024/d2c-event-data-platform-api:v0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: D2C_ENV
              value: production
            - name: ALLOW_FAILURE_DRILL
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: d2c-api-secret
                  key: DATABASE_URL
            - name: TRUSTED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: d2c-platform-config
                  key: TRUSTED_HOSTS
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  strategy:
    canary:
      stableService: d2c-api-stable
      canaryService: d2c-api-canary
      trafficRouting:
        nginx:
          stableIngress: d2c-api
      maxSurge: 25%
      maxUnavailable: 0
      scaleDownDelaySeconds: 30
      abortScaleDownDelaySeconds: 30
      steps:
        - setWeight: 10
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: d2c-approval-canary-gate
            args:
              - name: service-name
                value: d2c-api-canary
              - name: publisher-service-name
                value: d2c-outbox-publisher
              - name: prometheus-address
                value: http://prometheus-operated.monitoring.svc.cluster.local:9090
        - setWeight: 50
        - pause:
            duration: 60s
        - analysis:
            templates:
              - templateName: d2c-approval-canary-gate
            args:
              - name: service-name
                value: d2c-api-canary
              - name: publisher-service-name
                value: d2c-outbox-publisher
              - name: prometheus-address
                value: http://prometheus-operated.monitoring.svc.cluster.local:9090

apiVersion: apps/v1
kind: Deployment
metadata:
  name: d2c-outbox-publisher
  labels:
    app: d2c-outbox-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: d2c-outbox-publisher
  template:
    metadata:
      labels:
        app: d2c-outbox-publisher
        monitoring: d2c-outbox
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publisher
          image: ghcr.io/masondev1024/d2c-event-data-platform-api:v0.2.0
          command: [python, outbox_publisher.py]
          ports:
            - name: metrics
              containerPort: 9102
          envFrom:
            - configMapRef:
                name: d2c-platform-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: d2c-api-secret
                  key: DATABASE_URL
            - name: METRICS_PORT
              value: "9102"
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

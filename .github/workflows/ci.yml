name: ci

on:
  push:
    branches: ["main", "poc/**", "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement app/requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app services scripts d2c_contract.py log_gen.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check schema compatibility
        run: >-
          python scripts/check_schema_compatibility.py
          --baseline schemas/factory-sensor.v1.schema.json
          --candidate schemas/factory-sensor.v1.next.schema.json

      - name: Validate pipeline evidence invariants
        run: python scripts/validate_pipeline_evidence.py --manifest examples/pipeline-evidence.ci.json

      - name: Enforce local-only docs policy
        run: test -z "$(git ls-files -- docs)"

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize k8s/d2c/base >/tmp/d2c-base.yaml
          kubectl kustomize k8s/d2c/overlays/validation >/tmp/d2c-validation.yaml

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

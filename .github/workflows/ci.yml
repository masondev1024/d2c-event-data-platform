name: ci

on:
  push:
    branches: ["main", "dev", "poc/**", "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --requirement app/requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app services scripts lakehouse d2c_contract.py log_gen.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check schema compatibility
        run: >-
          python scripts/check_schema_compatibility.py
          --baseline schemas/factory-sensor.v1.schema.json
          --candidate schemas/factory-sensor.v1.next.schema.json

      - name: Validate pipeline evidence invariants
        run: python scripts/validate_pipeline_evidence.py --manifest examples/pipeline-evidence.ci.json

      - name: Validate data product catalog evidence
        run: python scripts/validate_catalog.py --catalog-dir catalog/data-products --repository-root .

      - name: Build catalog portal target
        run: docker build --target catalog-portal --tag d2c-catalog-portal:${{ github.sha }} .

      - name: Smoke test catalog portal target
        run: |
          container_id="$(docker run --detach --env CATALOG_BIND_HOST=0.0.0.0 --publish 127.0.0.1::8082 d2c-catalog-portal:${{ github.sha }})"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" || true
          }
          trap cleanup EXIT
          port="$(docker port "$container_id" 8082/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/healthz"; then
              curl --fail --silent --show-error "http://127.0.0.1:${port}/api/v1/data-products"
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Validate local lakehouse Compose profile
        run: docker compose --profile lakehouse config >/dev/null

      - name: Build Iceberg streaming image
        run: docker build --file lakehouse/Dockerfile --tag d2c-iceberg-stream:${{ github.sha }} .

      - name: Smoke test local Iceberg catalog
        run: >-
          docker run --rm
          d2c-iceberg-stream:${{ github.sha }}
          /opt/spark/bin/spark-submit
          --master 'local[1]'
          --conf spark.driver.memory=1g
          /opt/d2c-lakehouse/lakehouse/validate_d2c_iceberg.py

      - name: Enforce local-only docs policy
        run: test -z "$(git ls-files -- docs)"

      - name: Reproduce the 10k raffle recovery against the built Spark image
        timeout-minutes: 25
        env:
          RAFFLE_SPARK_IMAGE: d2c-iceberg-stream:${{ github.sha }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/raffle-check.XXXXXX")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            git clone --quiet --depth 1 --branch main "https://github.com/$GITHUB_REPOSITORY.git" "$work/data"
            git -C "$work/data" fetch --quiet --depth 1 origin "$GITHUB_SHA"
            git -C "$work/data" switch --quiet --detach "$GITHUB_SHA"
            cd "$work/data"
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clone --quiet https://github.com/masondev1024/aws-data-platform-gitops.git "$work/raffle-writer"
          git -C "$work/raffle-writer" switch --quiet --detach da4cd00539bcf5c5fc49f81724e788007567ace6
          python3 scripts/verify_raffle_recovery.py --writer "$work/raffle-writer" --evidence "$work/result.json"
          python3 - "$work/result.json" <<'PYTHON'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as evidence:
              result = json.load(evidence)
          for stage in ("before", "after_first", "after_retry"):
              row = result["iceberg"][stage]
              print(stage, "entries", row["fact_count"], "missing", row["missing_entry_ids"],
                    "mismatched_windows", row["mismatched_windows"])
          print("same_snapshot_on_retry",
                result["iceberg"]["after_first"]["snapshot_id"] == result["iceberg"]["after_retry"]["snapshot_id"])
          print("teardown_verified", result["teardown_verified"])
          PYTHON

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize k8s/d2c/base >/tmp/d2c-base.yaml
          kubectl kustomize k8s/d2c/overlays/validation >/tmp/d2c-validation.yaml

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

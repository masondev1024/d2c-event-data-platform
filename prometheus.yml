global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/prometheus-alerts.yml"

scrape_configs:
  - job_name: "sensor-processor"
    static_configs:
      - targets: ["stream-processor:9100"]

  - job_name: "sensor-sink"
    static_configs:
      - targets: ["stream-sink:9101"]

  - job_name: "d2c-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["d2c-api:8080"]

  - job_name: "d2c-outbox-publisher"
    static_configs:
      - targets: ["d2c-outbox-publisher:9102"]

  - job_name: "d2c-event-consumer"
    static_configs:
      - targets: ["d2c-event-consumer:9103"]
